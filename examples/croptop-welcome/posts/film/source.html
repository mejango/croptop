function croptopEmbedURL(manifest, siteURL, parentOrigin) {
  try {
    const site = new URL(siteURL), entry = manifest?.croptop;

        !Array.isArray(entry.origins) || !entry.origins.includes(parentOrigin) ||
        new URL(parentOrigin).protocol !== 'https:') return null;

    if (target.origin !== site.origin || target.username || target.password ||
        target.origin === parentOrigin) return null;
    return target.href;
  } catch { return null; }
}

      $('[data-status]').textContent=online?`${readers + 1} copies online.`:readers?`${readers} reader ${readers === 1 ? 'copy' : 'copies'} online. Yours is offline.`:'No copies online.';
      draw();
    };
    $('[data-add]').onclick=()=>{readers=Math.min(96,readers+1);update();};
    $('[data-remove]').onclick=()=>{readers=Math.max(0,readers-1);update();};
    $('[data-offline]').onclick=()=>{online=!online;update();};update();
  }
  size();frame=requestAnimationFrame(tick);root.dataset.ready = 'true';
})();
</script></body></html>
