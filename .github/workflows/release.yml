name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Promotion is an explicit operator action after all staging jobs finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Enforce draft-only release staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s installer -p 'test_release_guard.py' -v
          python3 installer/release_guard.py "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --allow-missing
      - name: Test and vet the tagged engine before building release artifacts
        run: |
          go test ./...
          go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.18.3"
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm the generated release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 installer/release_guard.py "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Retain generated Homebrew formula for post-promotion publishing
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula-${{ github.ref_name }}
          path: dist/homebrew/Formula/croptop.rb
          if-no-files-found: error

  windows-installer:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build croptop-setup into the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python installer/release_guard.py $env:GITHUB_REF_NAME --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          foreach ($arch in @("amd64", "arm64")) {
            gh release download $env:GITHUB_REF_NAME --pattern "croptop_${ver}_windows_${arch}.zip" --dir in
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Expand-Archive "in/croptop_${ver}_windows_${arch}.zip" "dist/windows_${arch}"
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$ver /DArch=$arch installer\windows.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python installer/release_guard.py $env:GITHUB_REF_NAME --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:GITHUB_REF_NAME dist/croptop-setup-amd64.exe dist/croptop-setup-arm64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  signed-mac-handoff:
    needs: [goreleaser, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Require local signed Mac artifacts before manual promotion
        run: |
          echo 'CLI/Linux/Windows assets are staged in a private draft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The release operator must build/sign/notarize Mac from this exact tag, verify the signed appcast, and upload all Mac artifacts and checksums into the draft.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No unsigned Mac fallback, appcast publication, latest promotion, or Homebrew update runs here. Follow docs/signing.md before publishing the complete release.' >> "$GITHUB_STEP_SUMMARY"
