name: mobile
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Operation recovery, pairing and desktop connection race checks
        run: go test -race ./internal/mobile ./internal/server ./scripts/mobile-smoke/bootstrap
      - name: Isolated pilot packaging and signing cleanup guards
        run: python3 -m unittest discover -s installer -p 'test_pilot_macos.py' -v
      - name: Patched Linux decoder and real HEIC geometry
        run: docker build --target mobile-media-test -t croptop-mobile-media-test:ci .

  web-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Browser signing and encrypted pairing conformance
        run: node --test web/mobile/protocol.test.mjs web/mobile/pairing.test.mjs web/mobile/sw-cache.test.mjs
      - name: Live smoke safety and commit-dispatch recovery guards
        run: node --test scripts/mobile-smoke/browser.test.mjs
      - name: Install the verified mobile browser engines
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/croptop-playwright-browsers
        run: |
          npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/croptop-playwright" playwright@1.63.0
          "$RUNNER_TEMP/croptop-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Chromium and WebKit phone publishing recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/croptop-playwright/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/croptop-playwright-browsers
        run: node --test web/mobile/browser.test.mjs
      - name: Worker security boundary and existing host regressions
        working-directory: worker
        run: node --experimental-loader ./text-loader.mjs --test test/*.test.mjs
      - name: Bundle the production, staging and isolated mobile Workers without deploying
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.145.0 deploy --dry-run --outdir "$RUNNER_TEMP/croptop-worker-production"
          npx --yes wrangler@4.145.0 deploy --dry-run --config wrangler.test.toml --outdir "$RUNNER_TEMP/croptop-worker-staging"
          npx --yes wrangler@4.145.0 deploy --dry-run --config wrangler.mobile.toml --outdir "$RUNNER_TEMP/croptop-worker-mobile"

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Shared signing, pairing, and durable draft tests
        run: swift test
      - name: Build the iPhone app and Share extension without signing
        run: >-
          xcodebuild -project Croptop.xcodeproj -scheme Croptop
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/croptop-ios-derived"
          CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build and test the Android companion
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
