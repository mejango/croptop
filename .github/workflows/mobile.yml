name: mobile
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Publication, cancellation, recovery and desktop connection race checks
        run: go test -race -p 1 ./internal/ctxlock ./internal/render ./internal/publish ./internal/mobile ./internal/server ./scripts/mobile-smoke/bootstrap
      - name: Isolated pilot packaging and signing cleanup guards
        run: python3 -m unittest discover -s installer -p 'test_pilot_macos.py' -v
      - name: Patched Linux decoder and real HEIC geometry
        run: docker build --target mobile-media-test -t croptop-mobile-media-test:ci .

  web-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Browser signing and encrypted pairing conformance
        run: node --test web/mobile/protocol.test.mjs web/mobile/pairing.test.mjs web/mobile/sw-cache.test.mjs
      - name: Live smoke safety and commit-dispatch recovery guards
        run: node --test scripts/mobile-smoke/browser.test.mjs
      - name: Install the verified mobile browser engines
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/croptop-playwright-browsers
        run: |
          npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/croptop-playwright" playwright@1.63.0
          "$RUNNER_TEMP/croptop-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Chromium and WebKit phone publishing recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/croptop-playwright/node_modules/playwright/index.mjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/croptop-playwright-browsers
        run: node --test web/mobile/browser.test.mjs web/mobile-connect.test.mjs
      - name: Worker security boundary and existing host regressions
        working-directory: worker
        run: node --experimental-loader ./text-loader.mjs --test test/*.test.mjs
      - name: Bundle the production, staging and isolated mobile Workers without deploying
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.145.0 deploy --dry-run --outdir "$RUNNER_TEMP/croptop-worker-production"
          npx --yes wrangler@4.145.0 deploy --dry-run --config wrangler.test.toml --outdir "$RUNNER_TEMP/croptop-worker-staging"
          npx --yes wrangler@4.145.0 deploy --dry-run --config wrangler.mobile.toml --outdir "$RUNNER_TEMP/croptop-worker-mobile"

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native phone setup, cancellation and updater safety
        working-directory: apps/macos
        run: swift test

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Shared signing, pairing, and durable draft tests
        run: swift test
      - name: Verify bundled icon and origin-derived release settings
        run: |
          swift Scripts/generate-app-icon.swift --check
          swift Scripts/generate-release-settings.swift --check
      - name: Real iPhone intake providers and platform lifecycle tests
        run: >-
          xcodebuild -project Croptop.xcodeproj -scheme Croptop
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1'
          -derivedDataPath "$RUNNER_TEMP/croptop-ios-derived"
          CODE_SIGNING_ALLOWED=NO test
      - name: iPhone draft setup and abrupt-relaunch UI recovery
        run: |
          CROPTOP_TEST_SIMULATOR=$(xcrun simctl create 'Croptop CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-1)
          xcrun simctl boot "$CROPTOP_TEST_SIMULATOR"
          xcrun simctl bootstatus "$CROPTOP_TEST_SIMULATOR" -b
          xcrun simctl addmedia "$CROPTOP_TEST_SIMULATOR" Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodebuild -project Croptop.xcodeproj -scheme CroptopUI -configuration Debug -destination "platform=iOS Simulator,id=$CROPTOP_TEST_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/croptop-ios-derived" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Build the iPhone app and Share extension without signing
        run: >-
          xcodebuild -project Croptop.xcodeproj -scheme Croptop
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/croptop-ios-derived"
          CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Test and package debug plus unsigned pilot releases
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Release signing must fail closed
        run: bash scripts/check-release-signing.sh
      - name: Enable the disposable runner's emulator acceleration
        run: sudo chmod 0666 /dev/kvm
      - name: Android 16 share, setup, and process-death recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CROPTOP_TEST_EMULATOR_SERIAL: emulator-5554
          CROPTOP_TEST_AVD_NAME: croptop-ci-android36
          CROPTOP_TEST_OUTPUT_DIR: ${{ runner.temp }}/croptop-android-device-tests
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: croptop-ci-android36
          emulator-port: 5554
          working-directory: apps/android
          script: |
            adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
            adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/emulator-smoke.sh
      - name: Retain Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croptop-android-device-evidence
          path: ${{ runner.temp }}/croptop-android-device-tests
          if-no-files-found: warn
      - name: Retain unsigned pilot artifacts (not a Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: croptop-android-unsigned-pilot
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
