name: Croptop
options:
  bundleIdPrefix: top.crop
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  generateEmptyDirectories: true
packages:
  CroptopMobileCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CLANG_ENABLE_MODULES: YES
targets:
  Croptop:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: CroptopMobileCore
      - target: CroptopShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.crop.mobile
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Croptop
        UILaunchScreen: {}
        CroptopKeychainGroup: $(AppIdentifierPrefix)top.crop.mobile.keys
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Croptop.entitlements
      properties:
        com.apple.security.application-groups: [group.top.crop.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)top.crop.mobile.keys]
  CroptopShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: CroptopMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.crop.mobile.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHARE_EXTENSION
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Croptop
        CroptopKeychainGroup: $(AppIdentifierPrefix)top.crop.mobile.keys
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/CroptopShare.entitlements
      properties:
        com.apple.security.application-groups: [group.top.crop.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)top.crop.mobile.keys]
  CroptopCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../../docs/design/mobile-protocol-fixture.json
        buildPhase: resources
      - path: ../../testdata/mobile-pairing-v1.json
        buildPhase: resources
    dependencies:
      - package: CroptopMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.crop.mobile.core-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Croptop:
    build:
      targets:
        Croptop: all
        CroptopShare: all
    run:
      config: Debug
    test:
      targets: [CroptopCoreTests]
    archive:
      config: Release
